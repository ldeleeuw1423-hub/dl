version: '3.9'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: infra_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infra_estimation}
      POSTGRES_USER: ${POSTGRES_USER:-infra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infra_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infra_user} -d ${POSTGRES_DB:-infra_estimation}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infra_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-infra_user}:${POSTGRES_PASSWORD:-infra_secret}@db:5432/${POSTGRES_DB:-infra_estimation}
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production-32chars-min}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - uploaded_files:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infra_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  uploaded_files:
